name: TEMP - list recent comments on all live goszakupki posts

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: List real account media + comments
        env:
          IG_GOSZAKUPKI_ID: ${{ secrets.IG_GOSZAKUPKI_ID }}
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
        run: |
          python3 -c "
          from ig_publish import Account, IGPublishError
          acc = Account.from_env('goszakupki')
          data = acc._request('GET', f'{acc.ig_id}/media', fields='id,caption,timestamp,permalink', limit=25)
          items = data.get('data', [])
          print(f'ВСЕГО МЕДИА НА АККАУНТЕ: {len(items)}')
          for m in items:
              print(f\"--- {m['id']} | {m.get('timestamp')} | {m.get('permalink')}\")
              print(f\"    caption: {(m.get('caption') or '')[:60]!r}\")
              try:
                  comments = acc.list_comments(m['id'])
              except IGPublishError as exc:
                  print(f'    OSHIBKA comments: {exc}')
                  continue
              print(f'    comments: {len(comments)}')
              for c in comments:
                  print(f\"       [{c.get('timestamp')}] {c.get('username')}: {c.get('text')!r}\")
          "
