name: TEMP - try newer API version for comments

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Try v25.0 vs v21.0
        env:
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
        run: |
          MEDIA_ID="18113946068107578"
          echo "--- v21.0 ---"
          curl -s "https://graph.instagram.com/v21.0/${MEDIA_ID}/comments?fields=id,text,username,timestamp&access_token=${IG_GOSZAKUPKI_TOKEN}"
          echo
          echo "--- v25.0 ---"
          curl -s "https://graph.instagram.com/v25.0/${MEDIA_ID}/comments?fields=id,text,username,timestamp&access_token=${IG_GOSZAKUPKI_TOKEN}"
          echo
          echo "--- без указания версии вообще ---"
          curl -s "https://graph.instagram.com/${MEDIA_ID}/comments?fields=id,text,username,timestamp&access_token=${IG_GOSZAKUPKI_TOKEN}"
          echo
