name: Check reply pipeline (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check decide()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -c "
          import requests, os, json
          from ig_reply import ANTHROPIC_API_URL, ANTHROPIC_MODEL, SYSTEM_PROMPT, DECIDE_TOOL
          payload = {
              'model': ANTHROPIC_MODEL,
              'max_tokens': 400,
              'system': SYSTEM_PROMPT.format(account='realbuiltbyone'),
              'messages': [{'role': 'user', 'content': 'Тип: комментарий. Текст: тест'}],
              'tools': [DECIDE_TOOL],
              'tool_choice': {'type': 'tool', 'name': 'decide_reply'},
          }
          r = requests.post(ANTHROPIC_API_URL, headers={
              'x-api-key': os.environ['ANTHROPIC_API_KEY'],
              'anthropic-version': '2023-06-01',
              'content-type': 'application/json',
          }, json=payload, timeout=60)
          print('STATUS', r.status_code)
          print('BODY', r.text)
          "
