name: Cleanup published media

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove media for posts published more than 24h ago
        run: python cleanup_media.py

      - name: Commit cleanup
        run: |
          if ! git diff --quiet -- media/ queue/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add media/ queue/
            git commit -m "cleanup: remove media for posts published >24h ago [skip ci]"
            for i in 1 2 3 4 5 6; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            echo "::error::Не удалось запушить cleanup после нескольких попыток"
            exit 1
          fi
