name: TEMP - check goszakupki token scopes

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: debug_token scopes (goszakupki)
        env:
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
        run: |
          curl -s "https://graph.instagram.com/debug_token?input_token=${IG_GOSZAKUPKI_TOKEN}&access_token=${IG_GOSZAKUPKI_TOKEN}" | python3 -c "import json,sys; d=json.load(sys.stdin); info=d.get('data',d); info.pop('access_token',None); print(json.dumps(info, indent=2, ensure_ascii=False))"
