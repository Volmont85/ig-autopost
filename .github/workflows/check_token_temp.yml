name: TEMP - check goszakupki token scopes

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: comments (manage_comments probe, read-only)
        env:
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
        run: |
          MEDIA_ID="18113946068107578"
          echo "--- GET /{media-id}/comments (нужен instagram_business_manage_comments) ---"
          curl -s "https://graph.instagram.com/v21.0/${MEDIA_ID}/comments?fields=id,text,username,timestamp&access_token=${IG_GOSZAKUPKI_TOKEN}" | python3 -m json.tool
