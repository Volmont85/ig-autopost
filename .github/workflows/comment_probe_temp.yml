name: Temporary read-only comment probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read target account and test comment only
        env:
          IG_GOSZAKUPKI_ID: ${{ secrets.IG_GOSZAKUPKI_ID }}
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,requests,ast
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          account=os.environ['IG_GOSZAKUPKI_ID'];token=os.environ['IG_GOSZAKUPKI_TOKEN']
          ns={'datetime':datetime,'timezone':timezone,'timedelta':timedelta,'json':json,'QUEUE_DIR':Path('queue'),'MEDIA_LOOKBACK_DAYS':14,'GOSZAKUPKI_LOOKBACK_DAYS':30}
          node=next(n for n in ast.parse(Path('ig_reply.py').read_text()).body if isinstance(n,ast.FunctionDef) and n.name=='_recent_media_ids')
          exec(compile(ast.Module(body=[node],type_ignores=[]),'<selector>','exec'),ns)
          selected=ns['_recent_media_ids']('goszakupki')
          print('CHECK selector',json.dumps({'runner_now':datetime.now(timezone.utc).isoformat(),'selected_count':len(selected),'target_selected':any(x[1]=='17982301209102749' for x in selected)}))
          def get(path,fields):
              r=requests.get('https://graph.instagram.com/v21.0/'+path,params={'access_token':token,'fields':fields,'limit':100},timeout=30)
              d=r.json()
              if 'error' in d:
                  e=d['error'];print('CHECK API_ERROR',json.dumps({'http':r.status_code,'code':e.get('code'),'subcode':e.get('error_subcode'),'message':e.get('message','').replace(token,'[REDACTED]')},ensure_ascii=False));return {}
              return d
          profile=get(account,'username');print('CHECK profile',json.dumps({'username':profile.get('username')}))
          media=get('17982301209102749','permalink,comments_count');print('CHECK media',json.dumps({'permalink':media.get('permalink'),'comments_count':media.get('comments_count')}))
          comments=get('17982301209102749/comments','id,text,username,replies{id,text,username}').get('data',[])
          matches=[{'id':c.get('id'),'username':c.get('username'),'text':c.get('text'),'reply_count':len(c.get('replies',{}).get('data',[]))} for c in comments if c.get('id')=='17959858089016480']
          print('CHECK comments',json.dumps({'returned_count':len(comments),'test_matches':matches},ensure_ascii=False))
          PY
