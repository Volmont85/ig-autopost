name: Check permissions (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check messaging permission
        env:
          IG_REALBUILTBYONE_ID: ${{ secrets.IG_REALBUILTBYONE_ID }}
          IG_REALBUILTBYONE_TOKEN: ${{ secrets.IG_REALBUILTBYONE_TOKEN }}
        run: |
          python3 -c "
          from ig_publish import Account, IGPublishError
          acc = Account.from_env('realbuiltbyone')
          try:
              convs = acc.list_conversations()
              print('MESSAGES OK, диалогов:', len(convs))
          except IGPublishError as e:
              print('MESSAGES FAIL:', e)

          # Комментарии: постов ещё нет, поэтому проверяем через media-эндпоинт —
          # если он вернёт список (пустой или нет) без ошибки прав, значит базовый
          # доступ есть; полноценно manage_comments проверим на первом реальном посте.
          try:
              data = acc._request('GET', f'{acc.ig_id}/media', fields='id')
              print('MEDIA LIST OK:', data)
          except IGPublishError as e:
              print('MEDIA LIST FAIL:', e)
          "
