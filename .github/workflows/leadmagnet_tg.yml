name: Lead magnet - Telegram bot poll

on:
  schedule:
    # Preserve the existing fallback schedule; the Railway heartbeat is external.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: Read-only Telegram bot/channel preflight
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leadmagnet-tg
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Poll Telegram or run read-only preflight
        env:
          TG_LEADMAGNET_BOT_TOKEN: ${{ secrets.TG_LEADMAGNET_BOT_TOKEN }}
          TG_GOSZAKUPKI_HELP_CHAT_ID: ${{ secrets.TG_GOSZAKUPKI_HELP_CHAT_ID }}
          TG_LEADMAGNET_CHECK_ONLY: ${{ inputs.check_only && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LEADMAGNET_HASH_KEY: ${{ secrets.LEADMAGNET_HASH_KEY }}
        run: python tg_leadmagnet_bot.py
