name: Lead magnet - Telegram bot poll

on:
  schedule:
    # Тот же принцип смещения минуты, что у остальных workflow — см. CLAUDE.md.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Своя группа — leadmagnet_tg/state.json не пересекается с
  # leadmagnet/goszakupki/state.json (IG-сторона), делить группу с
  # leadmagnet-ig незачем.
  group: leadmagnet-tg
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Poll Telegram getUpdates
        env:
          TG_LEADMAGNET_BOT_TOKEN: ${{ secrets.TG_LEADMAGNET_BOT_TOKEN }}
          TG_GOSZAKUPKI_HELP_CHAT_ID: ${{ secrets.TG_GOSZAKUPKI_HELP_CHAT_ID }}
        run: python tg_leadmagnet_bot.py

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain -- leadmagnet_tg 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add leadmagnet_tg
            git commit -m "leadmagnet-tg: offset update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

            for i in 1 2 3 4 5 6; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            echo "::error::Не удалось запушить состояние Telegram-бота после нескольких попыток"
            exit 1
          fi
