name: Lead magnet - handle IG quick reply

on:
  repository_dispatch:
    types: [ig_quick_reply]

permissions:
  contents: write

concurrency:
  # См. комментарий в leadmagnet_ig.yml — общая группа намеренно.
  group: leadmagnet-ig
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Handle quick-reply button press
        env:
          IG_GOSZAKUPKI_ID: ${{ secrets.IG_GOSZAKUPKI_ID }}
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
          TG_LEADMAGNET_BOT_USERNAME: ${{ vars.TG_LEADMAGNET_BOT_USERNAME }}
          LM_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        # Аккаунт захардкожен — сейчас лид-магнит подключён только для
        # goszakupki. Если появится второй аккаунт, здесь понадобится
        # сопоставление client_payload.ig_id -> имя аккаунта.
        run: python ig_leadmagnet.py handle-quick-reply goszakupki

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain -- leadmagnet stats 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add leadmagnet stats
            git commit -m "leadmagnet: quick-reply state update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

            for i in 1 2 3 4 5 6; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            echo "::error::Не удалось запушить состояние лид-магнита после нескольких попыток"
            exit 1
          fi
