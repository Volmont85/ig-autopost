name: Stats report (manual)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "За сколько последних дней (по умолчанию 7)"
        required: false
        type: string
        default: "7"

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch engagement stats
        env:
          IG_PERSONAL_ID: ${{ secrets.IG_PERSONAL_ID }}
          IG_PERSONAL_TOKEN: ${{ secrets.IG_PERSONAL_TOKEN }}
          IG_GOSZAKUPKI_ID: ${{ secrets.IG_GOSZAKUPKI_ID }}
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
        run: python stats.py "${{ inputs.days }}"
