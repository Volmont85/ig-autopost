name: Stats collect

on:
  schedule:
    # Каждые 6 часов. Минута смещена с ровных :00 намеренно — см. CLAUDE.md,
    # инцидент про систематический дроп schedule-тиков на GitHub.
    # Четыре тика в сутки выбраны не для точности, а с запасом на дроп: даже
    # если половину GitHub не выполнит, сторис всё равно будут замерены внутри
    # своего 24-часового окна, после которого insights пропадают навсегда.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Замерить все посты, игнорируя расписание замеров"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect stats
        env:
          IG_PERSONAL_ID: ${{ secrets.IG_PERSONAL_ID }}
          IG_PERSONAL_TOKEN: ${{ secrets.IG_PERSONAL_TOKEN }}
          IG_GOSZAKUPKI_ID: ${{ secrets.IG_GOSZAKUPKI_ID }}
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
        run: python stats.py ${{ inputs.force && '--all' || '' }}

      - name: Commit stats
        run: |
          if ! git diff --quiet -- stats/ || [ -n "$(git status --porcelain stats/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add stats/
            git commit -m "stats: snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

            # Тот же паттерн, что в publish.yml: push может быть отклонён, если
            # параллельно закоммитил publish.yml или локальный автопуш на Маке.
            # history.jsonl дописывается только в конец и только этим workflow,
            # поэтому rebase здесь почти всегда проходит без конфликта.
            for i in 1 2 3 4 5 6; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            echo "::error::Не удалось запушить статистику после нескольких попыток"
            exit 1
          fi
