name: Lead magnet - verified subscription and Composio delivery

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'Only goszakupki is supported'
        default: 'goszakupki'
        type: string
      check_only:
        description: 'Read-only Composio connection check; never sends messages'
        default: false
        type: boolean
      event_driven:
        description: 'Drain authenticated encrypted webhook events; do not poll Instagram'
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: leadmagnet-ig
  cancel-in-progress: false

jobs:
  poll:
    # Fail closed for any unexpected account or fork.
    if: github.repository == 'Volmont85/ig-autopost' && (inputs.account == '' || inputs.account == 'goszakupki')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verified lead-magnet delivery
        env:
          COMPOSIO_CONSUMER_API_KEY: ${{ secrets.COMPOSIO_CONSUMER_API_KEY }}
          LEADMAGNET_HASH_KEY: ${{ secrets.LEADMAGNET_HASH_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LEADMAGNET_CHECK_ONLY: ${{ inputs.check_only || 'false' }}
          LEADMAGNET_EVENT_DRIVEN: ${{ inputs.event_driven || 'false' }}
          IG_EVENT_ENCRYPTION_KEY: ${{ secrets.IG_EVENT_ENCRYPTION_KEY }}
        run: python leadmagnet_worker.py
