name: Publish queue

on:
  schedule:
    # Смещено с ровных :00/:30 намеренно — именно на эти минуты целится
    # cron большинства чужих репозиториев на GitHub, отсюда перегрузка
    # инфраструктуры и систематический дроп тиков (см. CLAUDE.md, инцидент
    # про schedule). Это теперь резервный триггер — основную точность даёт
    # локальный heartbeat на Маке (workflow_dispatch каждые 5 минут).
    - cron: "3,33 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "queue/**"
      - "media/**"

permissions:
  contents: write

concurrency:
  # Heartbeat дёргает workflow_dispatch каждые 5 минут независимо от того,
  # закончился ли предыдущий прогон — при сбоях GitHub Actions (см. CLAUDE.md,
  # инцидент с Major Outage 2026-08-06) это накапливает десятки queued-запусков.
  # Без этой группы они могли бы стартовать разом и опубликовать одну и ту же
  # запись очереди по нескольку раз (run_queue.py не имеет блокировки между
  # параллельными процессами). cancel-in-progress: false — не отменяем, а
  # выстраиваем в очередь, чтобы ни один тик публикации не потерялся.
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run queue
        id: run_queue
        env:
          IG_PERSONAL_ID: ${{ secrets.IG_PERSONAL_ID }}
          IG_PERSONAL_TOKEN: ${{ secrets.IG_PERSONAL_TOKEN }}
          IG_GOSZAKUPKI_ID: ${{ secrets.IG_GOSZAKUPKI_ID }}
          IG_GOSZAKUPKI_TOKEN: ${{ secrets.IG_GOSZAKUPKI_TOKEN }}
          IG_REALBUILTBYONE_ID: ${{ secrets.IG_REALBUILTBYONE_ID }}
          IG_REALBUILTBYONE_TOKEN: ${{ secrets.IG_REALBUILTBYONE_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          python run_queue.py | tee run_queue.log
          IDS=$(grep -oP '(?<=\[)[^]]+(?=\] опубликовано)' run_queue.log | paste -sd, -)
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Commit updated queue entries
        run: |
          if ! git diff --quiet -- queue/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add queue/
            IDS="${{ steps.run_queue.outputs.ids }}"
            if [ -z "$IDS" ]; then
              git commit -m "queue: updated [skip ci]"
            else
              git commit -m "queue: published $IDS [skip ci]"
            fi

            # Критично: если push отклонён (кто-то ещё успел запушить раньше),
            # ОБЯЗАТЕЛЬНО подтянуть и перебазировать наш коммит и повторить —
            # иначе факт уже состоявшейся публикации (media_id, status: done)
            # не сохранится, и следующий прогон опубликует то же самое ещё раз.
            # Разбивка queue.json на отдельные файлы (queue/<id>.json) сильно
            # снижает частоту таких конфликтов, но полностью не исключает —
            # два актёра всё ещё могут коснуться одного и того же файла.
            for i in 1 2 3 4 5 6; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            echo "::error::Не удалось запушить обновлённые записи после нескольких попыток — статус публикации мог не сохраниться, проверь вручную"
            exit 1
          fi
