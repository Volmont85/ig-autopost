name: TEMP - copy realbuiltbyone secrets to neyrobyuro

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy ID and TOKEN under new name (value never printed/logged)
        env:
          IG_REALBUILTBYONE_ID: ${{ secrets.IG_REALBUILTBYONE_ID }}
          IG_REALBUILTBYONE_TOKEN: ${{ secrets.IG_REALBUILTBYONE_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_NEYROBYURO_ID --body "$IG_REALBUILTBYONE_ID" --repo "$GITHUB_REPOSITORY"
          gh secret set IG_NEYROBYURO_TOKEN --body "$IG_REALBUILTBYONE_TOKEN" --repo "$GITHUB_REPOSITORY"
          echo "done"
